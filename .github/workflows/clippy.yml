name: Clippy Check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: cargo clippy --all-targets --all-features -- -D warnings
