[package]
name = "geoscribefs"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.12"
prost = "0.13"
clap = { version = "4.0", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
fuser = "0.18"
nix = { version = "0.31", features = ["mount", "sched"] }
libc = "0.2"
fuse-backend-rs = { git = "https://github.com/cloud-hypervisor/fuse-backend-rs", features = ["fusedev", "async-io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-uring = "0.5.0"
test-log = {version="0.2.21", features = ["trace"]}
chrono = "0.4.45"


[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"

[build-dependencies]
tonic-build = "0.12"
